# Build verification for the standalone ReliefNT kernel tree: every push and
# pull request must prove `make all` produces all three kernel products
# (kernel.sys, kernel.debug, kerneldebug.sys).
# Build-only by design: no tests, no artifact upload.

name: Build ReliefNT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliefnt-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Toolchain for the kernel products and native Linux Kconfig front end.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-rt-dev \
            llvm \
            lld \
            git \
            make \
            bison \
            flex \
            pkg-config \
            libncurses-dev \
            gzip \
            curl \
            python3

      # Fetches the pinned Unifont build input; compilation verifies its hash.
      - name: Fetch locked dependencies
        run: make fetch

      - name: Build all products
        run: make all
